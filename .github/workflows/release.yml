name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  resolve-version:
    name: Resolve & verify version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IS_TAG=false
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            IS_TAG=true
          fi

          VSCE_VERSION="$(node -p "require('./vscode/package.json').version")"
          IDEA_VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' jetbrains/build.gradle.kts)"
          echo "vscode=$VSCE_VERSION jetbrains=$IDEA_VERSION ref=$GITHUB_REF"

          if [ "$VSCE_VERSION" != "$IDEA_VERSION" ]; then
            echo "::error::vscode/package.json ($VSCE_VERSION) 与 jetbrains/build.gradle.kts ($IDEA_VERSION) 版本不一致,请先统一版本号"
            exit 1
          fi

          if $IS_TAG; then
            TAG="$GITHUB_REF_NAME"
            if [ "${TAG#v}" != "$VSCE_VERSION" ]; then
              echo "::error::标签 $TAG 与项目版本 $VSCE_VERSION 不一致"
              exit 1
            fi
            SKIP=false
          else
            # 手动触发:版本号取自当前 main。Release 已存在说明忘了升版本号,
            # 直接报错拦下,避免把新构建覆盖到历史 Release 上
            TAG="v$VSCE_VERSION"
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "::error::Release $TAG 已存在。若要发布新版本,请先合并一个更新版本号的 PR(两个子项目保持一致);若要重传安装包,请删除该 Release 后重跑"
              exit 1
            fi
            SKIP=false
          fi

          echo "resolved tag=$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-jetbrains:
    name: Build JetBrains plugin zip
    needs: resolve-version
    if: needs.resolve-version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache IntelliJ Platform
        uses: actions/cache@v4
        with:
          path: jetbrains/.intellijPlatform
          key: intellij-platform-${{ hashFiles('jetbrains/build.gradle.kts', 'jetbrains/settings.gradle.kts', 'jetbrains/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: intellij-platform-

      - uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        working-directory: jetbrains
        run: ./gradlew buildPlugin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jetbrains-plugin
          path: jetbrains/build/distributions/*.zip
          if-no-files-found: error

  build-vscode:
    name: Build VS Code extension vsix
    needs: resolve-version
    if: needs.resolve-version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Compile and package
        working-directory: vscode
        run: |
          npm ci
          npm run compile
          npx --yes @vscode/vsce package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: vscode/*.vsix
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [resolve-version, build-jetbrains, build-vscode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-version.outputs.tag }}
        run: |
          ls -lR dist
          FILES=(dist/jetbrains-plugin/*.zip dist/vscode-extension/*.vsix)
          # workflow_dispatch 触发时 tag 尚不存在,gh 会自动在 main HEAD 上创建;
          # 标签触发时 tag 已存在,直接挂载 release。
          # create 失败(如重跑时 Release 刚被建出)则退化为覆盖上传资产
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            "${FILES[@]}" \
          || gh release upload "$TAG" --clobber "${FILES[@]}"
