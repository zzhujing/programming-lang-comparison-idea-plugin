name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jetbrains:
    name: JetBrains plugin build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache IntelliJ Platform
        uses: actions/cache@v4
        with:
          path: jetbrains/.intellijPlatform
          key: intellij-platform-${{ hashFiles('jetbrains/build.gradle.kts', 'jetbrains/settings.gradle.kts', 'jetbrains/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: intellij-platform-

      - uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        working-directory: jetbrains
        run: ./gradlew buildPlugin

  vscode:
    name: VS Code extension build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Compile
        working-directory: vscode
        run: |
          npm ci
          npm run compile

      - name: Package (vsce dry run)
        working-directory: vscode
        run: npx --yes @vscode/vsce package
